<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Сброс кеша конвертера</title><style>body{font:16px -apple-system,BlinkMacSystemFont,sans-serif;background:#f5f7fb;color:#17243c;margin:0;padding:40px 22px}.box{max-width:440px;margin:auto}h1{font-size:23px}p{line-height:1.5;color:#58667b}a{color:#315cda}</style></head><body><main class="box"><h1>Обновление конвертера</h1><p id="status">Удаляем кеш приложения…</p><p><a href="./index.html?fresh=1">Открыть конвертер вручную</a></p></main><script>(async()=>{const status=document.getElementById('status');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.scope.startsWith(new URL('./',location.href).href)).map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('vnd-pwa-')).map(k=>caches.delete(k)))}status.textContent='Кеш приложения очищен. Открываем свежую версию…';location.replace('./index.html?fresh='+Date.now())}catch(e){status.textContent='Не удалось полностью очистить кеш: '+e.message+'. Попробуйте открыть конвертер вручную.'}})();</script></body></html>
