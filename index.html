<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f5f7fb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Донги"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="./icon.svg?v=6"><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=8"><title>Конвертер донгов</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#17243c;font:16px -apple-system,BlinkMacSystemFont,sans-serif}.app{max-width:460px;margin:auto;padding:calc(30px + env(safe-area-inset-top)) 20px 32px}h1{font-size:25px;margin:0 0 6px}.sub{font-size:13px;color:#718096;margin:0 0 30px}.label{font-size:13px;color:#718096;margin-bottom:9px}.line{display:flex;gap:10px}input{min-width:0;border:1px solid #dce2ed;border-radius:15px;padding:16px;background:white;color:#17243c;font:600 28px -apple-system,sans-serif;width:100%;outline:none}input:focus{border-color:#3d66dc}button{touch-action:manipulation;border:0;border-radius:15px;cursor:pointer;font-weight:700}.k{width:62px;flex-shrink:0;background:#315cda;color:white;font-size:22px}.minus-k{background:#e7edfa;color:#315cda}.clear{margin:12px 0 0;background:none;color:#65758c;font-size:14px;padding:5px 0}.hint{font-size:12px;color:#7c8797;margin:12px 0 22px}.results{border:1px solid #e0e5ee;border-radius:20px;background:white;padding:4px 18px}.result{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:20px 0}.result+.result{border-top:1px solid #eef1f5}.value{font-size:23px;font-weight:750;font-variant-numeric:tabular-nums;text-align:right}.currency{font-size:15px;color:#58667b}.status{font-size:12px;line-height:1.5;color:#728094;margin:18px 0 10px}.refresh{padding:11px 14px;background:#e7edfa;color:#2f52a5;font-size:14px}details{margin-top:26px;border-top:1px solid #dce2eb;padding-top:18px}summary{font-size:14px;color:#58667b;cursor:pointer}.rates{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.rates label{font-size:12px;color:#718096}.rates input{font-size:16px;padding:11px;margin-top:7px;border-radius:10px}.note{font-size:12px;line-height:1.5;color:#7c8797;margin-top:12px}</style></head><body><main class="app"><h1>Конвертер донгов 🇻🇳</h1><p class="sub">Вьетнамские донги → BYN и USD</p><div class="label">Сумма в донгах (VND)</div><div class="line"><input id="amount" type="text" inputmode="numeric" autocomplete="off" placeholder="Например, 180"><button class="k minus-k" id="minusK">−K</button><button class="k" id="k">K</button></div><button class="clear" id="clear">Очистить</button><div class="hint">K = × 1 000. Два нажатия = × 1 000 000.</div><div class="results"><div class="result"><span class="currency">🇧🇾 BYN</span><strong class="value" id="byn">0,00</strong></div><div class="result"><span class="currency">🇺🇸 USD</span><strong class="value" id="usd">0,00</strong></div></div><div id="status" class="status"></div><button id="refresh" class="refresh">↻ Обновить курсы</button><details><summary>Настройки курсов</summary><div class="rates"><label>VND за 1 USD<input id="usdRate" type="number" min="1" step="any"></label><label>VND за 1 BYN<input id="bynRate" type="number" min="1" step="any"></label></div><p class="note">Курсы справочные. Банковский курс и курс обменника могут отличаться.</p></details></main><script>const el=id=>document.getElementById(id),fmt=n=>new Intl.NumberFormat('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);let rates;try{rates=JSON.parse(localStorage.getItem('vnd-rates'))}catch(e){}rates=rates||{usd:26000,byn:8500,updated:null,source:'Примерные курсы — обновите перед использованием'};function save(){localStorage.setItem('vnd-rates',JSON.stringify(rates))}function amount(){return Number(el('amount').value.replace(/\D/g,''))||0}function resizeAmount(){const input=el('amount');const len=input.value.length;input.style.fontSize=(len>13?16:len>10?18:len>8?21:len>6?24:28)+'px'}function render(){let n=amount();el('amount').value=n?n.toLocaleString('ru-RU').replace(/[\u00a0\u202f]/g,' '):el('amount').value.trim()?'0':'';resizeAmount();el('byn').textContent=fmt(n/rates.byn);el('usd').textContent=fmt(n/rates.usd);el('usdRate').value=rates.usd;el('bynRate').value=rates.byn;el('status').textContent=rates.updated?'Обновлено: '+new Date(rates.updated).toLocaleString('ru-RU')+' · '+rates.source:rates.source}el('amount').addEventListener('input',render);el('k').onclick=()=>{let n=amount();if(n>999999999999){alert('Слишком большая сумма');return}el('amount').value=String(n*1000);render()};el('minusK').onclick=()=>{let n=amount();el('amount').value=String(Math.floor(n/1000));render()};el('clear').onclick=()=>{el('amount').value='';render();el('amount').focus()};for(let [id,key] of [['usdRate','usd'],['bynRate','byn']])el(id).addEventListener('change',()=>{let n=Number(el(id).value);if(n>0){rates[key]=n;rates.updated=null;rates.source='Курсы заданы вручную';save()}render()});async function refresh(){let b=el('refresh');b.disabled=true;b.textContent='Обновление…';try{let r=await fetch('https://open.er-api.com/v6/latest/VND',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json();if(d.result!=='success'||!d.rates?.USD||!d.rates?.BYN)throw Error('Нет данных');rates={usd:1/d.rates.USD,byn:1/d.rates.BYN,updated:new Date().toISOString(),source:'open.er-api.com'};save();render()}catch(e){el('status').textContent='Не удалось обновить. Используются сохраненные курсы.'}finally{b.disabled=false;b.textContent='↻ Обновить курсы'}}el('refresh').onclick=refresh;render();if(navigator.onLine&&(!rates.updated||Date.now()-new Date(rates.updated).getTime()>43200000))refresh();document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
