<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f5f7fb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Донги"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="./icon.svg?v=6"><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=8"><title>Конвертер донгов</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#17243c;font:16px -apple-system,BlinkMacSystemFont,sans-serif}.app{max-width:460px;margin:auto;padding:calc(30px + env(safe-area-inset-top)) 20px 32px}h1{font-size:25px;margin:0 0 6px}.sub{font-size:13px;color:#718096;margin:0 0 30px}.label{font-size:13px;color:#718096;margin-bottom:9px}.line{display:flex;gap:10px}input{min-width:0;border:1px solid #dce2ed;border-radius:15px;padding:16px;background:white;color:#17243c;font:600 28px -apple-system,sans-serif;width:100%;outline:none}input:focus{border-color:#3d66dc}[hidden]{display:none!important}button{touch-action:manipulation;border:0;border-radius:15px;cursor:pointer;font-weight:700}.k{width:56px;flex-shrink:0;background:#315cda;color:white;font-size:22px}.minus-k{background:#e7edfa;color:#315cda}.clear{margin:12px 0 0;background:none;color:#65758c;font-size:14px;padding:5px 0}.results{border:1px solid #e0e5ee;border-radius:20px;background:white;padding:4px 18px}.result{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:20px 0}.result+.result{border-top:1px solid #eef1f5}.value{font-size:23px;font-weight:750;font-variant-numeric:tabular-nums;text-align:right}.currency{font-size:15px;color:#58667b}.status{font-size:12px;line-height:1.5;color:#728094;margin:18px 0 10px}.refresh{padding:11px 14px;background:#e7edfa;color:#2f52a5;font-size:14px}details{margin-top:26px;border-top:1px solid #dce2eb;padding-top:18px}summary{font-size:14px;color:#58667b;cursor:pointer}.rates{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.rates label{font-size:12px;color:#718096}.rates input{font-size:16px;padding:11px;margin-top:7px;border-radius:10px}.quick{display:flex;gap:7px;margin:12px 0 0}.quick button{flex:1;min-width:0;min-height:58px;padding:12px 4px;background:#e7edfa;color:#315cda;font-size:15px;border-radius:15px}.mode-options{display:flex;gap:8px;margin-top:12px}.mode-options button{flex:1;padding:11px 6px;background:#e7edfa;color:#315cda;font-size:14px}.mode-options button.active{background:#315cda;color:white}.mode-details{margin-top:22px}.mode-details summary{font-size:13px;color:#728094}.fresh{font-size:12px;line-height:1.5;color:#728094;margin:18px 0 10px}.fresh.old{color:#b36b18}.note{font-size:12px;line-height:1.5;color:#7c8797;margin-top:12px}</style></head><body><main class="app"><h1>Конвертер донгов 🇻🇳</h1><p class="sub">Вьетнамские донги → BYN и USD</p><div class="label" id="inputLabel">Сумма в донгах (VND)</div><div class="line"><input id="amount" type="text" inputmode="numeric" autocomplete="off" placeholder="180"><button class="k minus-k" id="minusK">−K</button><button class="k" id="k">K</button></div><div class="quick" id="quick"><button data-add="10000">+10K</button><button data-add="100000">+100K</button><button data-add="1000000">+1M</button></div><button class="clear" id="clear">Очистить</button><div class="results"><div class="result"><span class="currency" id="currency1">🇧🇾 BYN</span><strong class="value" id="byn">0,00</strong></div><div class="result"><span class="currency" id="currency2">🇺🇸 USD</span><strong class="value" id="usd">0,00</strong></div></div><div id="status" class="fresh"></div><button id="refresh" class="refresh">↻ Обновить курсы</button><details><summary>Настройки курсов</summary><div class="rates"><label>VND за 1 USD<input id="usdRate" type="number" min="1" step="any"></label><label>VND за 1 BYN<input id="bynRate" type="number" min="1" step="any"></label></div><p class="note">Курсы справочные. Банковский курс и курс обменника могут отличаться.</p></details><details class="mode-details"><summary id="modeSummary">⇄ Изменить направление конвертации</summary><div class="mode-options"><button data-mode="vnd" class="active">🇻🇳 VND</button><button data-mode="usd">🇺🇸 USD</button><button data-mode="byn">🇧🇾 BYN</button></div><p class="note">Выберите валюту для ввода. Результаты появятся выше.</p></details></main><script>const el=id=>document.getElementById(id),fmt=n=>new Intl.NumberFormat('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);let rates;try{rates=JSON.parse(localStorage.getItem('vnd-rates'))}catch(e){}rates=rates||{usd:26000,byn:8500,updated:null,source:'Примерные курсы — обновите перед использованием'};function save(){localStorage.setItem('vnd-rates',JSON.stringify(rates))}let mode='vnd';const names={vnd:'🇻🇳 VND',usd:'🇺🇸 USD',byn:'🇧🇾 BYN'};function amount(){const raw=el('amount').value.replace(/\s/g,'').replace(',','.');return Number(raw)||0}function resizeAmount(){const input=el('amount');const probe=document.createElement('canvas').getContext('2d');const style=getComputedStyle(input);const available=input.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight)-4;let size=28;const content=input.value||input.placeholder;while(size>16){probe.font='600 '+size+'px -apple-system, sans-serif';if(probe.measureText(content).width<=available)break;size--}input.style.fontSize=size+'px'}function setMode(next){mode=next;el('amount').value='';el('amount').inputMode=mode==='vnd'?'numeric':'decimal';el('inputLabel').textContent='Сумма в '+({vnd:'донгах (VND)',usd:'долларах (USD)',byn:'белорусских рублях (BYN)'}[mode]);el('amount').placeholder=mode==='vnd'?'180':'10';el('quick').hidden=mode!=='vnd';el('k').hidden=mode!=='vnd';el('minusK').hidden=mode!=='vnd';document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));el('modeSummary').textContent='⇄ Валюта ввода: '+names[mode]+' · изменить';render()}function output(n,currency){const vnd=mode==='vnd'?n:mode==='usd'?n*rates.usd:n*rates.byn;return currency==='vnd'?Math.round(vnd).toLocaleString('ru-RU'):fmt(vnd/rates[currency])}function statusRender(){if(!rates.updated){el('status').className='fresh old';el('status').textContent=rates.source;return}const age=Date.now()-new Date(rates.updated).getTime();if(!Number.isFinite(age)){el('status').textContent='Дата курса неизвестна';return}const hours=Math.max(0,Math.floor(age/3600000));const label=hours<1?'менее часа назад':hours<24?hours+' ч назад':Math.floor(hours/24)+' дн назад';el('status').className='fresh'+(age>86400000?' old':'');el('status').textContent=(age>86400000?'⚠ Курс устарел · ':'Курс обновлен ') +label+' · '+rates.source+(navigator.onLine?'':' · офлайн')}function render(){const input=el('amount');let n=amount();if(mode==='vnd'){input.value=n?n.toLocaleString('ru-RU').replace(/[\u00a0\u202f]/g,' '):input.value.trim()?'0':''}else{input.value=input.value.replace(/[^\d.,\s]/g,'')}resizeAmount();const targets=mode==='vnd'?['byn','usd']:mode==='usd'?['byn','vnd']:['usd','vnd'];el('currency1').textContent=names[targets[0]];el('currency2').textContent=names[targets[1]];el('byn').textContent=output(n,targets[0]);el('usd').textContent=output(n,targets[1]);el('usdRate').value=rates.usd;el('bynRate').value=rates.byn;statusRender()}el('amount').addEventListener('input',render);el('amount').addEventListener('focus',()=>el('amount').select());window.addEventListener('resize',resizeAmount);document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const n=amount()+Number(b.dataset.add);if(n>999999999999999){alert('Слишком большая сумма');return}el('amount').value=String(n);render()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));el('k').onclick=()=>{let n=amount();if(n>999999999999){alert('Слишком большая сумма');return}el('amount').value=String(n*1000);render()};el('minusK').onclick=()=>{let n=amount();el('amount').value=String(Math.floor(n/1000));render()};el('clear').onclick=()=>{el('amount').value='';render();el('amount').focus()};for(let [id,key] of [['usdRate','usd'],['bynRate','byn']])el(id).addEventListener('change',()=>{let n=Number(el(id).value);if(n>0){rates[key]=n;rates.updated=null;rates.source='Курсы заданы вручную';save()}render()});async function refresh(){let b=el('refresh');b.disabled=true;b.textContent='Обновление…';try{let r=await fetch('https://open.er-api.com/v6/latest/VND',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json();if(d.result!=='success'||!d.rates?.USD||!d.rates?.BYN)throw Error('Нет данных');rates={usd:1/d.rates.USD,byn:1/d.rates.BYN,updated:new Date().toISOString(),source:'open.er-api.com'};save();render()}catch(e){statusRender();el('status').textContent+=' · Не удалось обновить'}finally{b.disabled=false;b.textContent='↻ Обновить курсы'}}el('refresh').onclick=refresh;setMode('vnd');window.addEventListener('online',statusRender);window.addEventListener('offline',statusRender);if(navigator.onLine&&(!rates.updated||Date.now()-new Date(rates.updated).getTime()>43200000))refresh();document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
